[pytest]
DJANGO_SETTINGS_MODULE = project.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --strict-markers
    --browser chromium
    --headed
testpaths = tests

# Playwright specific settings
# Use --headed to see the browser (useful for debugging)
# Use --browser to specify browser: chromium, firefox, webkit
# Use --slowmo 1000 to slow down operations by 1000ms (helpful for debugging)
