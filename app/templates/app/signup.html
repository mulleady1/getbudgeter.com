{% extends "app/base.html" %}

{% block header %}
{% endblock %}

{% block content %}
  <style>
    body {
      background: #f7f8fa;
      font-family: var(--wa-font-sans);
    }
    main {
      padding-top: 10vh;
    }
    .signup-container {
      max-width: 350px;
      margin: 0 auto;
      background: #fff;
      padding: 2.5rem 2rem 2rem 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 799px) {
      .signup-container {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }
    .signup-logo {
      margin-bottom: 1.2rem;
      align-self: center;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .signup-logo img {
      height: 35px;
      width: auto;
      margin-bottom: 0.3rem;
    }
    .signup-logo span {
      font-size: 1.3rem;
      font-weight: 600;
      color: #444;
    }
    .signup-container h1 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-weight: 600;
      font-size: 1.7rem;
      color: #222;
    }
    .signup-container form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    /* Plain inputs in the light DOM, not wa-input: password managers can't see into shadow roots. */
    .signup-container label {
      display: block;
    }
    .signup-container label .required::after {
      content: "*";
      margin-left: 0.1em;
    }
    /* Honeypot: off-screen, not display:none, so form-stuffing scripts still treat it as real. */
    .signup-container .extra-field {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
  <div class="signup-container">
    <div class="signup-logo">
      <img src="/static/logo.png" alt="Budgeter Logo" />
      <span>Budgeter Signup</span>
    </div>
    {% if error %}
      <div style="margin-bottom: 1rem;">
        <wa-callout variant="warning" open>
          <wa-icon slot="icon" name="exclamation-triangle"></wa-icon>
          {{ error }}
        </wa-callout>
      </div>
    {% endif %}
    <form id="signup-form" method="post">
      {% csrf_token %}
      {# Enter in a field only submits a form that has a native submit button; wa-button isn't one. #}
      <button type="submit" hidden tabindex="-1" aria-hidden="true"></button>
      <input type="hidden" id="timezone" name="timezone" />
      <input type="hidden" name="form_token" value="{{ form_token }}" />
      <div class="extra-field" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
      </div>
      <div>
        <label for="email"><span class="required">Email</span></label>
        <input type="email" id="email" name="email" value="{{ email }}" autocomplete="username" required />
      </div>
      <div>
        <label for="password"><span class="required">Password</span></label>
        <input type="password" id="password" name="password" value="{{ password }}" autocomplete="new-password" required />
      </div>
      <div>
        <label for="confirm_password"><span class="required">Confirm Password</span></label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          value="{{ confirm_password }}"
          autocomplete="new-password"
          required
        />
      </div>
      <div style="padding-top: 0.5rem;">
        <wa-button type="submit" style="width: 100%;">Signup</wa-button>
      </div>
      <div style="padding-top: 0.5rem;">
        <a href="/login">Login</a>
      </div>
    </form>
  </div>

  <script type="module">
    const form = document.getElementById("signup-form")
    document.getElementById("timezone").value = Intl.DateTimeFormat().resolvedOptions().timeZone
    const submitButton = form.querySelector("wa-button[type='submit']")
    form.addEventListener("submit", event => {
      submitButton.loading = true
      submitButton.disabled = true
    })
  </script>
{% endblock %}
